name: Build DataGrip AppImage

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    - cron: '0 0 * * *' # Cada día a medianoche
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest version
        id: check_version
        run: |
          VERSION=$(curl -s "https://data.services.jetbrains.com/products/releases?code=DG&latest=true&type=release" | jq -r '.DG[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if already built
        id: check_release
        run: |
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/latest"
          RELEASE_DESC=$(curl -s $API_URL | jq -r '.body')
          if [[ "$RELEASE_DESC" == *"${{ steps.check_version.outputs.version }}"* ]] && [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_release.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 jq wget curl

      - name: Build AppImage
        if: steps.check_release.outputs.skip != 'true'
        run: ./build.sh

      - name: Upload Artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: datagrip-appimage
          path: build/*.AppImage*

      - name: Create Release (Tags)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.AppImage*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Latest)
        if: (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: "DataGrip Version: ${{ steps.check_version.outputs.version }}"
          files: build/*.AppImage*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build DataGrip AppImage

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    - cron: '0 0 * * *' # Cada día a medianoche
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest version
        id: check_version
        run: |
          VERSION=$(curl -s "https://data.services.jetbrains.com/products/releases?code=DG&latest=true&type=release" | jq -r '.DG[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if already built
        id: check_release
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          REPO="${{ github.repository }}"
          
          echo "Detected version: $VERSION"
          
          # Solo saltar si es una ejecución programada (schedule) Y la versión ya existe
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            RELEASE_INFO=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/v$VERSION")
            RELEASE_ID=$(echo "$RELEASE_INFO" | jq -r '.id // empty')
            
            if [[ ! -z "$RELEASE_ID" ]]; then
              echo "Version $VERSION already exists. Skipping scheduled build."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          echo "Proceeding with build."
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.check_release.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 jq wget curl

      - name: Build AppImage
        if: steps.check_release.outputs.skip != 'true'
        run: ./build.sh

      - name: Upload Artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: datagrip-appimage
          path: build/*.AppImage*

      - name: Create Release
        if: steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: DataGrip ${{ steps.check_version.outputs.version }}
          body: |
            Automated build of DataGrip AppImage.
            Version: ${{ steps.check_version.outputs.version }}
          files: build/*.AppImage*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Tag
        if: steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: "DataGrip Version: ${{ steps.check_version.outputs.version }}"
          files: build/*.AppImage*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
